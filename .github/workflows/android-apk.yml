name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

# One build at a time: two runs publishing the same binary file at once can not be merged.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # The permanent signing key lives only in GitHub Secrets (this repository is public).
      # Without it a throw-away key is used: the build is still tested, but it can not update an installed app,
      # so it is published without forcing anyone to update.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "STABLE_KEY=true" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias temp -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PW" -keypass "$PW" -dname "CN=PlayWorld temporary build"
            echo "STABLE_KEY=false" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_* secrets are not set: building with a temporary key (updates over an installed app will not work)."
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p mobile/android assembleRelease -PversionCode="$APP_VERSION_CODE"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n rs.playworld.reseller/rs.playworld.reseller.MainActivity
            sleep 8
            ! adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'
            test -n "$(adb shell pidof rs.playworld.reseller)"
            adb shell uiautomator dump /sdcard/playworld-window.xml >/dev/null
            adb shell cat /sdcard/playworld-window.xml | grep -q 'Povežite uređaj'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playworld-reseller-android-test
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The site's "Preuzmi za Android" button serves downloads/PlayWorld-Reseller.apk (deployed by cPanel Git).
      # downloads/app-version.json tells every installed app which version is the minimum allowed to run.
      - name: Publish APK to the site (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          STAGE="$RUNNER_TEMP/publish"
          mkdir -p "$STAGE"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$STAGE/PlayWorld-Reseller.apk"
          STAGE="$STAGE" python3 - <<'PY'
          import hashlib, json, os, datetime
          stage = os.environ["STAGE"]
          code = int(os.environ["APP_VERSION_CODE"])
          stable = os.environ.get("STABLE_KEY") == "true"
          sha = hashlib.sha256(open(stage + "/PlayWorld-Reseller.apk", "rb").read()).hexdigest()
          json.dump({"android": {
              "code": code, "name": f"1.0.{code}",
              # Only a build signed with the permanent key can replace an installed app, so only then it is mandatory.
              "min_code": code if stable else 1, "stable_key": stable, "sha256": sha,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}},
              open(stage + "/app-version.json", "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always start from the newest main (no rebase: binary files can not be merged), then add our two files.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p downloads
            cp "$STAGE/PlayWorld-Reseller.apk" "$STAGE/app-version.json" downloads/
            git add downloads/PlayWorld-Reseller.apk downloads/app-version.json
            if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
            git commit -q -m "Publish Android APK build [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
