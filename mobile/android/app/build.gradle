plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'rs.playworld.reseller'
    compileSdk 36

    defaultConfig {
        applicationId 'rs.playworld.reseller'
        minSdk 26
        targetSdk 36
        // CI passes -PversionCode=<run number>, so every published APK is newer than the previous one.
        def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"
    }

    // Signing material comes from the environment (GitHub Secrets); it is never stored in the repository.
    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
