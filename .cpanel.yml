---
deployment:
  tasks:
    - export DEPLOYPATH=/home/psigrersrs/reseller.psigre.rs/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/mkdir -p $DEPLOYPATH/vendor
    - /bin/mkdir -p $DEPLOYPATH/sql
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/mkdir -p $DEPLOYPATH/downloads
    - /bin/cp -f index.html admin.html manifest.webmanifest .htaccess $DEPLOYPATH/
    - /bin/cp -R -f assets/. $DEPLOYPATH/assets/
    - /bin/cp -R -f downloads/. $DEPLOYPATH/downloads/
    - /bin/cp -f api/*.php api/.htaccess $DEPLOYPATH/api/
    - /bin/cp -R -f vendor/. $DEPLOYPATH/vendor/
    - /bin/cp -f sql/*.sql $DEPLOYPATH/sql/
